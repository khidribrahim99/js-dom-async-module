<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive to-do list built with HTML, CSS, and JavaScript.">
  <title>Interactive To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="todo-container">
    <header class="todo-header">
      <p class="eyebrow">MY DAILY PLANNER</p>
      <h1>Interactive To Do List</h1>
      <p class="subtitle">Select a task when you finish it.</p>
    </header>

    <section class="task-section" aria-labelledby="task-heading">
      <div class="section-heading">
        <h2 id="task-heading">My tasks</h2>
        <p id="task-count" aria-live="polite">0 of 5 completed</p>
      </div>

      <ul class="task-list" id="task-list">
        <li><button class="task" type="button" aria-pressed="false"><span class="task-check" aria-hidden="true">✓</span><span>Read for 30 minutes</span></button></li>
        <li><button class="task" type="button" aria-pressed="false"><span class="task-check" aria-hidden="true">✓</span><span>Complete JavaScript practice</span></button></li>
        <li><button class="task" type="button" aria-pressed="false"><span class="task-check" aria-hidden="true">✓</span><span>Reply to important emails</span></button></li>
        <li><button class="task" type="button" aria-pressed="false"><span class="task-check" aria-hidden="true">✓</span><span>Take a short walk</span></button></li>
        <li><button class="task" type="button" aria-pressed="false"><span class="task-check" aria-hidden="true">✓</span><span>Plan tomorrow's activities</span></button></li>
      </ul>
    </section>

    <p class="tip">Tip: Click any task to mark it complete or active again.</p>
  </main>
</body>
</html>
